plugins {
    id 'groovy-gradle-plugin'
}

// Load iChunUtil's common.properties
Properties properties = new Properties()
FileInputStream input = new FileInputStream(file("${rootDir}/../common.properties"))
properties.load(input)
input.close()

for (String key : properties.stringPropertyNames()) {
    ext.set(key, properties.getProperty(key))
}

repositories {
    maven {
        name = 'Gradle Plugin Portal'
        url "https://plugins.gradle.org/m2/"
    }

    maven {
        name = 'ModPublisher https://github.com/firstdarkdev/modpublisher'
        url "https://maven.firstdark.dev/releases"
    }
}

dependencies {
    implementation "com.hypherionmc.modutils:modpublisher:${modpublisher_version}"
    implementation "com.gradleup.shadow:shadow-gradle-plugin:${shadowjar_version}"
}
